[program:xterm1]
command=xterm -T "MAVROS" -geometry "100x24+0+0" -e ros2 launch mavros descert.launch.py fcu_url:="udp://127.0.0.1:14550@"
autostart=true
autorestart=false
priority=350

[program:xterm2]
command=bash -c 'sleep 2; xterm -T "Vehicle Sim" -geometry "100x24+0+0" -e "sim_vehicle.py -N -v ArduCopter --out=udp:127.0.0.1:14550 --mavproxy-args=\"--out=udp:127.0.0.1:14551\""'
autostart=true
autorestart=false
priority=350

[program:xterm3]
command=bash -c 'sleep 2; xterm -T "Arducopter Console" -geometry "100x24+0+0" -e "mavproxy.py --master=udp:127.0.0.1:14550 --console"'
autostart=true
autorestart=false
priority=350

[program:xterm4]
command=bash -c 'sleep 2; xterm -T "Arducopter Map" -geometry "100x24+0+0" -e "mavproxy.py --master=udp:127.0.0.1:14551 --map"'
autostart=true
autorestart=false
priority=350

[program:xterm5]
command=bash -c 'sleep 5; xterm -T "Radler Gateway" -geometry "100x24+0+350" -e "~/ros2_ws/install/afs/bin/afs_gateway"'
autostart=true
autorestart=true
priority=360

[program:xterm6]
command=bash -c 'sleep 5; xterm -T "Radler Function" -geometry "100x24+0+650" -e "~/ros2_ws/install/afs/bin/afs_function"'
autostart=true
autorestart=true
priority=360

