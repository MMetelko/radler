[program:xterm1]
command=xterm -T "MAVROS" -geometry "60x24+0+0" -e ros2 launch mavros descert_adj.launch.py fcu_url:="udp://127.0.0.1:14550@"
autostart=true
autorestart=false
priority=350

[program:xterm2]
command=bash -c 'sleep 2; xterm -T "Vehicle Sim" -geometry "60x24+0+0" -e "sim_vehicle.py -N -v ArduCopter --console --map --out=udp:127.0.0.1:14550 --out=udp:127.0.0.1:14551"'
autostart=true
autorestart=false
priority=350

